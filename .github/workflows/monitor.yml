name: monitor

# Vercel Hobby cron is limited to once/day, so GitHub Actions (free) drives the
# schedule instead — see docs/architecture.md. Set repo secrets APP_URL and
# CRON_SECRET (Settings > Secrets and variables > Actions).
on:
  schedule:
    # Once a day, to keep Firecrawl credits inside the free monthly allowance.
    # It runs in DeepSeek's off-peak (half-price) window: peak is 01-04 and
    # 06-10 UTC on weekdays (src/lib/llm/peak.ts). 04:17 leaves 1h40m of slack
    # before peak for GitHub's scheduling delays; minute 17 dodges the
    # top-of-hour queue.
    - cron: "17 4 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitoring pass
        run: |
          code=$(curl -sS --max-time 330 -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/public/cron/monitor")
          echo "HTTP $code"; cat /tmp/body; echo
          test "$code" = "200"
