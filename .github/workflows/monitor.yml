name: monitor

# Vercel Hobby cron is limited to once/day, so GitHub Actions (free) drives the
# schedule instead — see docs/architecture.md. Set repo secrets APP_URL and
# CRON_SECRET (Settings > Secrets and variables > Actions).
on:
  schedule:
    # The full pass (web search + Firecrawl fallback) runs once a day, to keep
    # credits inside the free monthly allowance. It sits in DeepSeek's off-peak
    # (half-price) window: peak is 01-04 and 06-10 UTC on weekdays
    # (src/lib/llm/peak.ts); 04:17 leaves slack for GitHub's delays.
    - cron: "17 4 * * *"
    # Light passes read only the free sources (feeds, HN, papers, models) every
    # hour, so a story is on the wire, and a breaking one in the inbox, within
    # the hour. The repo is public, so these Actions minutes are free.
    - cron: "47 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitoring pass
        run: |
          code=$(curl -sS --max-time 330 -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/public/cron/monitor${{ github.event.schedule == '47 * * * *' && '?mode=light' || '' }}")
          echo "HTTP $code"; cat /tmp/body; echo
          test "$code" = "200"
