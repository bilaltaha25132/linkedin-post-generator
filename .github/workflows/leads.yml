name: leads

# The Leads tab's pass: HN, Freelancer.com, the gig marketplaces, and Reddit/Tavily/Exa when their keys
# are set; contract roles from Jobs; scoring; alerts and follow-up nudges.
# Three times a day, since the search indexes don't move faster. Same secrets as monitor.yml.
on:
  schedule:
    - cron: "20 3,11,17 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Workana and Guru refuse Vercel; a failure here never stops the pass.
      - name: Relay blocked marketplaces
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/relay.mjs leads
      - name: Trigger leads pass
        run: |
          code=$(curl -sS --max-time 330 -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/public/cron/leads")
          echo "HTTP $code"; cat /tmp/body; echo
          test "$code" = "200"
